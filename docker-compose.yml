services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database (lives at /app/pkg/db/social-network.db)
      - sqlite-data:/app/pkg/db
      # Persist uploaded files (app creates uploads/ and public/ inside)
      - backend-storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
  backend-storage:
